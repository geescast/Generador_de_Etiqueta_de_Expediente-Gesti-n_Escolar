<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Etiqueta - Gestión Escolar ESCA</title>
    <!-- Librería para el Código de Barras -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    
    <style>
        /* Estilos generales y layout */
        body { font-family: Arial, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; display: flex; gap: 20px; }
        .panel { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .form-panel { width: 350px; flex-shrink: 0; }
        .preview-panel { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #e0e0e0; padding: 20px; }
        
        /* Controles de formulario */
        label { display: block; margin-top: 15px; font-weight: bold; font-size: 0.85em; color: #333; }
        input, select { width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; text-transform: uppercase; }
        
        /* Botones */
        button { margin-top: 20px; width: 100%; padding: 10px; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; }
        #btn-print { background: #682444; color: white; } /* Color Guinda IPN */
        #btn-print:disabled { background: #ccc; cursor: not-allowed; }
        #btn-example { background: #444; color: white; margin-bottom: 10px; font-size: 0.85em;}
        
        /* Contenedor de la hoja tamaño Carta */
        .label-container { background: white; width: 21.59cm; height: 27.94cm; padding: 2cm; box-sizing: border-box; position: relative; box-shadow: 0 4px 6px rgba(0,0,0,0.1); overflow: hidden; }
        
        /* SECCIÓN 1: Pestaña del folder - MEDIDA EXACTA 16cm x 2cm */
        .section-1-tab-box { 
            width: 16cm; 
            height: 2cm; 
            border: 2px solid black; 
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14pt;
            font-weight: bold;
            text-align: center;
            text-transform: uppercase;
        }

        /* SECCIÓN 2: Datos principales */
        .section-2-data-box { width: 16cm; border: 3px solid black; padding: 8px; box-sizing: border-box; }
        .data-row { background: #e6ebf5; margin-bottom: 5px; padding: 5px; text-align: center; font-size: 12pt; min-height: 24px; font-weight: bold; text-transform: uppercase; }
        .barcode-row { background: white; display: flex; justify-content: center; padding-top: 10px; }
        
        /* Instrucciones y marca de agua */
        .instructions { font-size: 10pt; margin-top: 20px; color: #555; }
        .watermark { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); color: rgba(255, 0, 0, 0.7); font-size: 24pt; font-weight: bold; border: 4px solid rgba(255, 0, 0, 0.7); padding: 20px; text-align: center; z-index: 10; background: rgba(255,255,255,0.8); }
        
        /* Estilos de Impresión */
        @media print {
            body { margin: 0; padding: 0; background: white; display: block; }
            .form-panel, .preview-panel { display: block; padding: 0; background: transparent; box-shadow: none; }
            .form-panel { display: none; } /* Oculta el formulario al imprimir */
            .label-container { box-shadow: none; padding: 0; width: 100%; height: auto; }
            .watermark { display: none !important; }
            .data-row { background: #e6ebf5 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            @page { margin: 2cm; size: letter; }
        }
    </style>
</head>
<body>

    <!-- PANEL IZQUIERDO: Formulario -->
    <div class="panel form-panel">
        <h3 style="margin-top: 0;">1. Captura de Datos</h3>
        <button id="btn-example" onclick="fillExample()">Cargar Ejemplo Oficial</button>
        
        <label>NOMBRE COMPLETO (INICIANDO POR APELLIDOS) *</label>
        <input type="text" id="in-nombre" placeholder="EJ. LOPEZ MENDOZA ALEJANDRO DANIEL" oninput="updatePreview()">
        
        <label>BOLETA O PREBOLETA (10 DÍGITOS) *</label>
        <input type="text" id="in-boleta" placeholder="EJ. 2027407185" maxlength="10" oninput="updatePreview()">
        
        <label>CURP (18 CARACTERES) *</label>
        <input type="text" id="in-curp" placeholder="EJ. LOMA080514HDFMNR04" maxlength="18" oninput="updatePreview()">
        
        <label>PROGRAMA ACADÉMICO *</label>
        <select id="in-programa" onchange="updatePreview()">
            <option value="">-- SELECCIONA TU PROGRAMA ACADÉMICO --</option>
            <option value="CONTADOR PÚBLICO">CONTADOR PÚBLICO</option>
            <option value="ADMINISTRACIÓN Y DESARROLLO EMPRESARIAL">ADMINISTRACIÓN Y DESARROLLO EMPRESARIAL</option>
            <option value="RELACIONES COMERCIALES">RELACIONES COMERCIALES</option>
            <option value="NEGOCIOS INTERNACIONALES">NEGOCIOS INTERNACIONALES</option>
            <option value="COMERCIO INTERNACIONAL">COMERCIO INTERNACIONAL</option>
            <option value="NEGOCIOS DIGITALES">NEGOCIOS DIGITALES</option>
            <option value="MERCADOTECNIA DIGITAL">MERCADOTECNIA DIGITAL</option>
        </select>
        
        <label>GRUPO ASIGNADO *</label>
        <input type="text" id="in-grupo" placeholder="EJ. 1CM4" oninput="updatePreview()">
        
        <button id="btn-print" onclick="window.print()" disabled>Imprimir Etiqueta</button>
        <p id="status-msg" style="color: red; font-size: 0.85em; margin-top: 10px;">Llenar los 5 campos para habilitar impresión.</p>
    </div>

    <!-- PANEL DERECHO: Vista Previa y PDF -->
    <div class="panel preview-panel">
        <div class="label-container" id="printable-area">
            
            <div id="watermark" class="watermark">VISTA BLOQUEADA<br><span style="font-size: 14pt;">LLENA TODOS LOS CAMPOS<br>EN EL PANEL IZQUIERDO</span></div>
            
            <!-- SECCIÓN 1 -->
            <div class="section-1-tab-box" id="out-nombre1"></div>
            
            <!-- SECCIÓN 2 -->
            <div class="section-2-data-box">
                <div class="data-row" id="out-boleta1"></div>
                <div class="data-row" id="out-curp"></div>
                <div class="data-row" id="out-programa"></div>
                <div class="data-row" id="out-grupo"></div>
                <div class="data-row barcode-row">
                    <svg id="barcode"></svg>
                </div>
            </div>
            
            <!-- INSTRUCCIONES -->
            <div class="instructions">
                <p><strong>(1)</strong> ESTA SECCIÓN LA DEBERÁS PEGAR EN LA PESTAÑA DE TU FOLDER</p>
                <p><strong>(2)</strong> ESTA SECCIÓN LA DEBERÁS PEGAR DEBAJO DE DONDE COLOCASTE TU NOMBRE</p>
            </div>

        </div>
    </div>

    <!-- SCRIPT DE LÓGICA Y VALIDACIÓN -->
    <script>
        // Función para cargar los datos inventados que pediste
        function fillExample() {
            document.getElementById('in-nombre').value = 'LOPEZ MENDOZA ALEJANDRO DANIEL';
            document.getElementById('in-boleta').value = '2027407185'; // 10 dígitos, 7º caracter es mayor a 5
            document.getElementById('in-curp').value = 'LOMA080514HDFMNR04';
            document.getElementById('in-programa').value = 'ADMINISTRACIÓN Y DESARROLLO EMPRESARIAL';
            document.getElementById('in-grupo').value = '1CM4';
            updatePreview();
        }

        // Función que actualiza la etiqueta en tiempo real
        function updatePreview() {
            const nombre = document.getElementById('in-nombre').value.toUpperCase();
            const boleta = document.getElementById('in-boleta').value.toUpperCase();
            const curp = document.getElementById('in-curp').value.toUpperCase();
            const programa = document.getElementById('in-programa').value;
            const grupo = document.getElementById('in-grupo').value.toUpperCase();

            document.getElementById('out-nombre1').innerText = nombre;
            document.getElementById('out-boleta1').innerText = boleta ? `*${boleta}*` : '';
            document.getElementById('out-curp').innerText = curp;
            document.getElementById('out-programa').innerText = programa;
            document.getElementById('out-grupo').innerText = grupo;

            // Generar Código de Barras si hay texto
            if(boleta.length > 0) {
                try {
                    JsBarcode("#barcode", boleta, {
                        format: "CODE128",
                        lineColor: "#000",
                        width: 2,
                        height: 40,
                        displayValue: false
                    });
                } catch(e) {}
            } else {
                document.getElementById('barcode').innerHTML = '';
            }

            // Validar para desbloquear impresión (Boleta exacta de 10 dígitos y CURP de 18)
            const isValid = nombre.trim().length > 0 && boleta.length === 10 && curp.length === 18 && programa !== '' && grupo.trim().length > 0;
            
            const printBtn = document.getElementById('btn-print');
            const watermark = document.getElementById('watermark');
            const statusMsg = document.getElementById('status-msg');

            if (isValid) {
                printBtn.disabled = false;
                watermark.style.display = 'none';
                statusMsg.innerText = '✓ Todos los datos listos. Ya puedes imprimir.';
                statusMsg.style.color = 'green';
            } else {
                printBtn.disabled = true;
                watermark.style.display = 'block';
                let alertMsg = 'Faltan datos obligatorios o son incorrectos: ';
                if(boleta.length > 0 && boleta.length !== 10) alertMsg += '(La boleta requiere 10 dígitos) ';
                if(curp.length > 0 && curp.length !== 18) alertMsg += '(El CURP requiere 18 caracteres)';
                statusMsg.innerText = alertMsg;
                statusMsg.style.color = 'red';
            }
        }
        
        // Bloquear Ctrl+P (Imprimir) si los campos no están completos
        window.addEventListener("keydown", function (e) {
            if ((e.ctrlKey || e.metaKey) && e.key === "p") {
                if (document.getElementById('btn-print').disabled) {
                    e.preventDefault();
                    alert("ACCESO DENEGADO: Por favor completa todos los campos (Boleta de 10 dígitos, CURP de 18, etc.) para desbloquear el formato.");
                }
            }
        });
    </script>
</body>
</html>
